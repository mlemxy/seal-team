<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seal Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Nunito:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a full-bleed 3D ice floe; HUD cards float at the edges like notes stuck to the ice.
   Single deliberate look (pastel arctic day, in-world night toggle), so no OS-theme switching. */
:root{
  --ice:#EEF8FB;
  --frost:rgba(255,255,255,.88);
  --cocoa:#4A3428;
  --cocoa-soft:#8A7365;
  --blush:#F4A7B4;
  --rule:rgba(74,52,40,.13);
  --ok:#2F9E6E; --wait:#E08A1E; --walk:#3E8FCB; --idle:#A99C93; --nap:#8F98C2;
  --display:"M PLUS Rounded 1c","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ice);color:var(--cocoa);font-family:var(--body);font-size:14px;overflow:hidden}
#app{position:relative;height:100%;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}

.card{background:var(--frost);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--rule);border-radius:18px;box-shadow:0 8px 28px rgba(74,52,40,.10)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--walk);outline-offset:2px}

/* top bar */
.top{position:absolute;top:16px;left:16px;right:16px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;pointer-events:none}
.top>*{pointer-events:auto}
.brand{padding:10px 16px 11px;display:flex;align-items:center;gap:12px}
.brand-mark{width:34px;height:34px;flex:none}
.brand h1{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;margin:0;letter-spacing:.01em}
.brand p{margin:3px 0 0;font-size:12px;color:var(--cocoa-soft);font-weight:600}
.stats{display:flex;gap:6px;flex-wrap:wrap;padding:8px;align-items:center}
.stat{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.75);font-weight:700;font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat i{width:8px;height:8px;border-radius:50%;display:inline-block}
.stat b{font-weight:800}
.controls{margin-left:auto;display:flex;gap:6px;padding:6px;flex-wrap:wrap}
.seg{display:flex;background:rgba(74,52,40,.06);border-radius:999px;padding:2px}
.seg button,.toggle{border:0;background:transparent;padding:6px 11px;border-radius:999px;font-weight:700;font-size:12.5px}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 4px rgba(74,52,40,.15)}
.toggle{background:rgba(74,52,40,.06)}
.toggle[aria-pressed="false"]{color:var(--cocoa-soft);text-decoration:line-through;text-decoration-thickness:1.5px}
.demo-chip.live{background:#D7F2E4;color:#1F7A52}
.demo-chip{align-self:center;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:#FCE7C8;color:#8A5A12}

/* roster */
#roster{position:absolute;left:16px;top:96px;width:282px;bottom:232px;overflow:auto;padding:14px 12px 12px;display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.sec-h h2{font-family:var(--display);font-weight:800;font-size:15px;margin:0}
.sec-h span{font-size:11.5px;color:var(--cocoa-soft);font-weight:600}
.pod{display:flex;flex-direction:column;gap:2px}
.pod-name{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--cocoa-soft);padding:4px 6px 2px}
.mate{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:6px;border-radius:12px}
.mate:hover{background:rgba(74,52,40,.05)}
.mate[aria-current="true"]{background:#fff;box-shadow:0 1px 6px rgba(74,52,40,.12)}
.face{width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--c);position:relative}
.face::before,.face::after{content:"";position:absolute;top:8px;width:3px;height:3px;border-radius:50%;background:var(--cocoa)}
.face::before{left:5px}.face::after{right:5px}
.mate .nm{min-width:0;display:flex;flex-direction:column;line-height:1.15}
.mate .nm b{font-weight:800;font-size:13.5px}
.mate .nm small{font-size:11.5px;color:var(--cocoa-soft);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:999px;white-space:nowrap;color:#fff;background:var(--idle)}
.pill.working{background:var(--ok)}.pill.waiting{background:var(--wait)}.pill.walking,.pill.returning{background:var(--walk)}.pill.sleeping{background:var(--nap)}
.board{display:flex;flex-direction:column;gap:8px;padding:10px 6px 2px;border-top:1px solid var(--rule)}
.proj{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:12.5px;font-weight:700}
.proj span{font-variant-numeric:tabular-nums;color:var(--cocoa-soft);font-size:11.5px}
.bar{grid-column:1/-1;height:7px;border-radius:99px;background:rgba(74,52,40,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c);transition:width .6s ease}

/* detail card */
#card{position:absolute;right:16px;top:96px;width:340px;max-height:calc(100% - 112px);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.c-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.c-head .big{width:46px;height:46px;border-width:3px}
.c-head .big::before,.c-head .big::after{top:17px;width:5px;height:5px}
.c-head .big::before{left:11px}.c-head .big::after{right:11px}
.c-head h3{margin:0;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1}
.c-head p{margin:2px 0 0;font-size:12.5px;color:var(--cocoa-soft);font-weight:700}
.x{border:0;background:rgba(74,52,40,.06);width:30px;height:30px;border-radius:50%;font-size:16px;line-height:1}
.c-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.c-stats div{background:rgba(255,255,255,.8);border-radius:12px;padding:8px 10px}
.c-stats b{display:block;font-family:var(--display);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.c-stats small{font-size:11px;color:var(--cocoa-soft);font-weight:700}
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--cocoa-soft);margin:0 0 6px}
.job{margin:0;line-height:1.5;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips span{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(74,52,40,.06)}
.chips.tools span{font-family:var(--mono);font-weight:500;font-size:11.5px;background:#fff;border:1px solid var(--rule)}
.now{background:#fff;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--rule)}
.now .t{font-weight:800;font-size:13.5px;line-height:1.35}
.now .meta{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--cocoa-soft);font-weight:700}
.prog{height:7px;border-radius:99px;background:rgba(74,52,40,.08);overflow:hidden}
.prog i{display:block;height:100%;background:var(--c)}
.ask{background:#FFF4E3;border:1px solid #F2C98A;border-radius:12px;padding:10px;font-size:13px;font-weight:700;line-height:1.4}
.ask-actions{display:flex;gap:6px;margin-top:8px}
.btn{border:0;border-radius:999px;padding:7px 14px;font-weight:800;font-size:12.5px;background:var(--cocoa);color:#fff}
.btn.ghost{background:rgba(74,52,40,.08);color:var(--cocoa)}
.recent{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.recent li{display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:baseline}
.recent time{font-family:var(--mono);font-size:11px;color:var(--cocoa-soft)}
.msg{display:flex;gap:6px}
.msg input{flex:1;min-width:0;border:1px solid var(--rule);background:#fff;border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;color:var(--cocoa)}

/* activity log */
#log{position:absolute;left:16px;bottom:16px;width:min(660px,calc(100% - 32px));height:200px;display:flex;flex-direction:column;overflow:hidden}
#log header{display:flex;align-items:baseline;gap:10px;padding:11px 14px 8px;border-bottom:1px solid var(--rule)}
#log header h2{font-family:var(--display);font-weight:800;font-size:15px;margin:0}
#log header span{font-size:11.5px;color:var(--cocoa-soft);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#log header code{font-family:var(--mono);font-size:11px}
#logList{list-style:none;margin:0;padding:6px 8px 8px;overflow:auto;flex:1}
#logList li{display:grid;grid-template-columns:58px 74px 58px 1fr auto;gap:8px;align-items:center;padding:4px 6px;border-radius:8px;font-size:12.5px}
#logList li:first-child{animation:flash 1.2s ease}
@keyframes flash{from{background:rgba(244,167,180,.35)}to{background:transparent}}
#logList time{font-family:var(--mono);font-size:11px;color:var(--cocoa-soft);font-variant-numeric:tabular-nums}
.who{font-weight:800;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool{font-family:var(--mono);font-size:10.5px;font-weight:500;text-align:center;padding:2px 0;border-radius:6px;background:rgba(74,52,40,.07)}
.tool.DONE{background:#DDF2E7;color:#1F7A52}.tool.ASK{background:#FDEBD0;color:#9A5A0B}.tool.SEND{background:#E3EEFA;color:#2C6CA3}.tool.START{background:#F1E9FA;color:#6B4A9A}
.what{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-tag{font-size:10.5px;font-weight:800;color:var(--c);white-space:nowrap}

/* in-world labels */
.seal-ui{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:4px;will-change:transform}
.tag{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:5px;background:#fff;border:1.5px solid var(--cocoa);border-radius:999px;padding:2px 8px 2px 6px;font-weight:800;font-size:11.5px;white-space:nowrap;box-shadow:0 2px 0 rgba(74,52,40,.18)}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--idle)}
.tag i.working{background:var(--ok)}.tag i.waiting{background:var(--wait)}.tag i.walking,.tag i.returning{background:var(--walk)}.tag i.sleeping{background:var(--nap)}
.tag.sel{background:var(--c);color:#fff;border-color:var(--c)}
.bubble{background:#fff;border-radius:12px;padding:4px 9px;font-size:11.5px;font-weight:700;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 3px 10px rgba(74,52,40,.15);position:relative}
.bubble b{font-family:var(--mono);font-weight:500;font-size:10.5px;margin-right:4px;color:var(--cocoa-soft)}
.bubble.waiting{background:#FFF1DC;border:1.5px solid var(--wait)}
.bubble.sleep{background:transparent;box-shadow:none;font-family:var(--display);font-weight:800;color:#7E89B8;font-size:13px;letter-spacing:.15em}
.st-label{position:absolute;left:0;top:0;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--cocoa);background:rgba(255,255,255,.72);padding:2px 7px;border-radius:6px;white-space:nowrap;will-change:transform}
.hide-names .tag,.hide-names .st-label{display:none}
.hide-bubbles .bubble{display:none}
.pop{position:absolute;left:0;top:0;font-family:var(--display);font-weight:800;font-size:13px;color:#2C6CA3;animation:pop 1.6s ease-out forwards;white-space:nowrap}
@keyframes pop{from{opacity:1;translate:0 0}to{opacity:0;translate:0 -46px}}

#teamBtn{display:none}

@media (max-width:760px){
  .top{gap:6px}
  .brand{padding:8px 12px}
  .brand h1{font-size:18px}
  .controls{margin-left:0}
  .stats{padding:6px}
  .stat{padding:4px 8px;font-size:11.5px}
  #roster{display:none;top:auto;left:16px;right:16px;bottom:16px;width:auto;max-height:62%;z-index:5}
  #roster.open{display:flex}
  #card{left:16px;right:16px;top:auto;bottom:16px;width:auto;max-height:62%;z-index:6}
  #log{height:132px}
  #logList li{grid-template-columns:54px 1fr;}
  #logList li .tool,#logList li .proj-tag{display:none}
  #logList li .what{grid-column:1/-1}
  #teamBtn{display:block;position:absolute;right:16px;bottom:160px;z-index:4;border:0;border-radius:999px;padding:10px 16px;font-weight:800;background:var(--cocoa);color:#fff;box-shadow:0 6px 18px rgba(74,52,40,.25)}
}
@media (prefers-reduced-motion:reduce){
  #logList li:first-child{animation:none}
  .pop{animation-duration:.01s}
}
</style>

</head>

      <div class="seg" role="group" aria-label="Time of day">
        <button id="dayBtn" aria-pressed="true">Day</button>
        <button id="nightBtn" aria-pressed="false">Night</button>
      </div>
      <button class="toggle" id="namesBtn" aria-pressed="true">Names</button>
      <button class="toggle" id="bubblesBtn" aria-pressed="true">Bubbles</button>
      <button class="toggle" id="pauseBtn" aria-pressed="true">Demo on</button>
      <span class="demo-chip" id="modeChip" title="Made-up events for the preview. Install the seal-team plugin to see your real agents.">Demo</span>

  <aside class="card" id="roster" aria-label="Team roster">

    </div>
  </aside>

  <section class="card" id="card" hidden aria-live="polite"></section>

  <section class="card" id="log" aria-label="Activity log">
    <header><h2>Activity</h2><span id="logNote">Made-up events. Install the mod to see your real agents.</span></header>
    <ul id="logList"></ul>
  </section>

  <button id="teamBtn" aria-expanded="false" aria-controls="roster">Team</button>
</div>

<script src="vendor/three.min.js"></script>

const SEAL_GEO = (() => {
  const g = new THREE.LatheGeometry(PROFILE, 44);
  g.rotateX(Math.PI / 2); g.translate(0, 0, -1.25); g.scale(1, .84, 1); g.translate(0, .65, 0);
  g.computeVertexNormals();
  const p = g.attributes.position, cols = [];
  const white = new THREE.Color('#FFFFFF'), belly = new THREE.Color('#E4DFD8'), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) { const y = p.getY(i); const k = Math.min(1, Math.max(0, (.34 - y) / .16)); c.copy(white).lerp(belly, k); cols.push(c.r, c.g, c.b); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  return g;
})();
const probe = new THREE.Mesh(SEAL_GEO, new THREE.MeshBasicMaterial({side:THREE.DoubleSide}));
probe.updateMatrixWorld();
const probeRay = new THREE.Raycaster();
function onFace(x, y) {
  probeRay.set(new THREE.Vector3(x, y, 6), new THREE.Vector3(0, 0, -1));
  const h = probeRay.intersectObject(probe)[0];
  if (!h) return {p:new THREE.Vector3(x, y, .9), n:new THREE.Vector3(0, 0, 1)};
  const n = h.face.normal.clone(); if (n.z < 0) n.negate();
  return {p:h.point.clone(), n};
}
function stick(mesh, x, y, off) {
  const f = onFace(x, y);
  mesh.position.copy(f.p).addScaledVector(f.n, off);
  mesh.lookAt(mesh.position.clone().add(f.n));
  return mesh;
}

function spotFor(stId, idx) {
  const st = ST[stId];
  const lat = ((idx % 4) - 1.5) * 1.35, fwd = Math.floor(idx / 4) * 1.4;
  return st.spot.clone().addScaledVector(st.perp, lat).addScaledVector(st.dir, fwd);
}
// In live mode idle seals lounge around the Command Igloo, facing out.
function loungeFor(idx) {
  const base = Math.atan2(HQ_DIR.z, HQ_DIR.x);
  const n = TEAM.length;
  const a = base + (idx - (n - 1) / 2) / (n - 1) * Math.PI * 1.4;
  return new THREE.Vector3(Math.cos(a) * 6.4, 0, Math.sin(a) * 6.4);
}

function route(a, b, depth) {
  depth = depth || 0;
  const R = 3.9;
  const vx = b.x - a.x, vz = b.z - a.z, L2 = vx * vx + vz * vz;
  if (L2 < 1e-6) return [];
  let u = -(a.x * vx + a.z * vz) / L2; u = Math.max(0, Math.min(1, u));
  const cx = a.x + vx * u, cz = a.z + vz * u, d = Math.hypot(cx, cz);
  if (depth < 3 && d < R && u > .02 && u < .98) {
    let nx = cx, nz = cz; if (d < .01) { nx = -vz; nz = vx; }
    const n = Math.hypot(nx, nz);
    const w = new THREE.Vector3(nx / n * (R + .9), 0, nz / n * (R + .9));
    return [w].concat(route(w, b, depth + 1));
  }
  return [b.clone()];
}

function log(s, tool, text, proj, when) {
  const d = when || new Date();

  if (s) { s.recent.unshift(entry); s.recent.length = Math.min(s.recent.length, 5); }

  logList.prepend(li);

function setPath(s, dest) { s.path = route(s.pos, dest); if (!s.path.length) arrive(s); }
function workSpot(s, station) { return spotFor(station, s.index); }

function startTask(s, t) {
  const [proj, station, tool, text, ask] = t;
  s.task = {proj, station, tool, text, ask, dur:rand(7, 12), p:0, asked:false};
  s.state = 'walking'; s.mode = 'toTask'; s.idleFor = 0;
  log(s, 'START', text, proj);
  setPath(s, workSpot(s, station));
}
function arrive(s) {
  if (s.mode === 'toTask' && s.task) {
    s.state = liveMode && s.task.ask ? 'waiting' : 'working';
    const st = ST[s.task.station]; s.yawTarget = Math.atan2(-st.dir.x, -st.dir.z);
  } else {
    s.state = 'idle'; s.idleFor = 0;
    if (liveMode) { s.yawTarget = Math.atan2(s.pos.x, s.pos.z); }
    else { const st = ST[s.def.home]; s.yawTarget = Math.atan2(st.dir.x, st.dir.z); }
  }
  s.mode = null;
}
function goHome(s) { s.task = null; s.state = 'returning'; s.mode = 'toHome'; setPath(s, s.home); }
function celebrate(s) { s.bounce = 3; s.bounceT = 0; s.spin = Math.PI * 2; }

// Seals talking to each other: a letter flies out with new work, a fish flies back with results.
const flyers = [];
function courier(kind) {
  const g = new THREE.Group();
  if (kind === 'fish') {
    const b = withOutline(new THREE.Mesh(new THREE.SphereGeometry(.22, 12, 8), toon('#F59E6B')), .02); b.scale.set(.7, .8, 1.6); g.add(b);
    const t = withOutline(new THREE.Mesh(new THREE.ConeGeometry(.18, .3, 4), toon('#F59E6B')), .02); t.rotation.x = -Math.PI / 2; t.position.z = -.45; t.scale.x = .4; g.add(t);
  } else {
    g.add(withOutline(new THREE.Mesh(new THREE.BoxGeometry(.56, .38, .06), toon('#FFF6EE')), .02));
    const flap = new THREE.Mesh(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-.28, .19, .035), new THREE.Vector3(.28, .19, .035), new THREE.Vector3(0, -.02, .035)]), basic('#E8D9C8'));
    g.add(flap);
    const heart = new THREE.Mesh(new THREE.SphereGeometry(.06, 10, 8), basic('#F27E9B')); heart.position.set(0, -.02, .05); g.add(heart);
  }
  scene.add(g);
  return g;
}
function face(s, other) { s.yawTarget = Math.atan2(other.pos.x - s.pos.x, other.pos.z - s.pos.z); }
function fly(from, to, kind) {
  if (!from || !to || from === to) return;
  if (flyers.length > 12) return;
  flyers.push({g:courier(kind), from, to, kind, t:0, dur:1.4});
  from.say = {text:kind === 'fish' ? 'Done! Here you go' : 'For you!', until:performance.now() + 2200};
  if (from.state === 'sleeping') from.state = 'idle';
  if (from.state === 'idle') { face(from, to); from.idleFor = 0; }
  from.bounce = Math.max(from.bounce, 1);
}
function updateFlyers(dt) {
  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i];
    f.t += dt / f.dur;
    const k = Math.min(1, f.t);
    f.g.position.set(lerp(f.from.pos.x, f.to.pos.x, k), 1.4 + Math.sin(Math.PI * k) * 4, lerp(f.from.pos.z, f.to.pos.z, k));
    f.g.rotation.y += dt * 5;
    f.g.rotation.z = Math.sin(f.t * 12) * .3;
    if (f.t >= 1) {
      scene.remove(f.g);
      flyers.splice(i, 1);
      const to = f.to;
      to.say = {text:f.kind === 'fish' ? 'Yum! Thank you' : 'On it!', until:performance.now() + 2200};
      if (to.state === 'sleeping') to.state = 'idle';
      if (to.state === 'idle') { face(to, f.from); to.idleFor = 0; }
      to.bounce = Math.max(to.bounce, 2); to.bounceT = 0;
      if (f.kind === 'fish') popAt(to, '+1 fish');
    }
  }
}

function finishTask(s) {
  const t = s.task;
  const gain = Math.round(rand(3, 7));
  s.xp += gain;
  log(s, 'DONE', t.text, t.proj);
  popAt(s, '+' + gain + ' fish');
  celebrate(s);
  const P = PROJECTS[t.proj];
  P.done = Math.min(P.total, P.done + 1);
  if (P.done >= P.total) P.total += 3;
  boardDirty = true;
  const sq = seals.find(x => x.def.id === 'squint');
  if (['pebble', 'pip', 'krill', 'rivet', 'sprinkle', 'bolt'].includes(s.def.id) && Math.random() < .6) {
    log(s, 'SEND', 'Sent for checking → Squint', t.proj);

    if (sq.state === 'idle' || sq.state === 'sleeping') setTimeout(() => { if (!liveMode && (sq.state === 'idle' || sq.state === 'sleeping')) startTask(sq, [t.proj, 'lab', 'CHECK', 'Checking ' + s.def.name + "'s work"]); }, 900);

  } else if (s.def.id !== 'mochi' && Math.random() < .5) {
    log(s, 'SEND', 'Result sent → Mochi', t.proj);
    fly(s, seals[0], 'fish');
  }

}

let waitingSeal = null;
function approve(s, yes) {
  if (s.state !== 'waiting') return;
  waitingSeal = null;
  if (yes) { log(null, 'OK', 'Approved ' + s.def.name + ': ' + s.task.text, s.task.proj); s.state = 'working'; }
  else { log(null, 'SKIP', 'Not now for ' + s.def.name, s.task.proj); goHome(s); }
  liveDirty = true;
}

let nextKick = 0, simTime = 0;
function simStep(dt) {
  if (paused) return;
  seals.forEach(s => {
    if (s.state === 'idle') { s.idleFor += dt; if (s.idleFor > (liveMode ? 40 : 14)) s.state = 'sleeping'; }
  });
  if (liveMode) return;
  simTime += dt;
  seals.forEach(s => {
    if (s.state === 'working' && s.task && !s.task.finished) {
      s.task.p += dt / s.task.dur;
      if (s.task.ask && !s.task.asked && s.task.p > .45 && !waitingSeal) {
        s.task.asked = true; s.state = 'waiting'; s.waitLeft = 30; waitingSeal = s;
        log(s, 'ASK', s.task.ask, s.task.proj);
      } else if (s.task.p >= 1) finishTask(s);
    } else if (s.state === 'waiting') {
      s.waitLeft -= dt;
      if (s.waitLeft <= 0) { waitingSeal = null; log(s, 'PARK', 'Parked until you are back: ' + s.task.text, s.task.proj); goHome(s); }
    }
  });
  if (simTime >= nextKick) {
    nextKick = simTime + rand(1.4, 2.8);
    const busy = seals.filter(s => ['walking', 'working', 'waiting', 'returning'].includes(s.state)).length;
    const free = seals.filter(s => s.state === 'idle' || s.state === 'sleeping');
    if (busy < 7 && free.length) {
      const s = pick(free);
      const t = pick(s.def.tasks);
      if (s.def.id !== 'mochi' && Math.random() < .5) { log(seals[0], 'SEND', 'Handed to ' + s.def.name + ': ' + t[3], t[0]); fly(seals[0], s, 'letter'); }
      startTask(s, t);
    }
  }
}

const SPEED = 3.2, HOP = .42;

function hopShape(frac) {
  // returns [lift, squashY, pitch]
  const lift = Math.sin(Math.PI * frac) * .55 * amp;
  let sq = 1 + Math.sin(Math.PI * frac) * .1 * amp;
  if (frac < .12) sq = 1 - (.12 - frac) / .12 * .2 * amp;
  else if (frac > .9) sq = 1 - (frac - .9) / .1 * .2 * amp;
  return [lift, sq, -Math.cos(Math.PI * frac) * .22 * amp];
}

    else { s.pos.x += dx / d * step; s.pos.z += dz / d * step; s.yawTarget = Math.atan2(dx, dz); }

  let lift = 0, sq = 1, pitch = 0, roll = 0, fR = 0, fL = 0, wag = Math.sin(t * 2 + s.phase) * .12;
  if (moving) {
    s.hopT += dt / HOP;
    [lift, sq, pitch] = hopShape(s.hopT % 1);
    wag = Math.sin(s.hopT * Math.PI * 2) * .3;
    fR = fL = Math.sin(s.hopT * Math.PI * 2) * .5;
  } else if (s.bounce > 0) {
    s.bounceT += dt / (HOP * .9);
    [lift, sq, pitch] = hopShape(s.bounceT % 1);
    lift *= .8; fR = fL = .6;
    if (s.bounceT >= 1) { s.bounceT -= 1; s.bounce -= 1; if (s.bounce === 0) s.bounceT = 0; }
  } else {
    s.hopT = 0;
    if (s.state === 'working') { pitch = Math.sin(t * 6 + s.phase) * .07 * amp; fR = Math.sin(t * 10 + s.phase) * .6 * amp; fL = -Math.sin(t * 10 + s.phase + 1.4) * .6 * amp; wag = Math.sin(t * 6) * .2; }
    else if (s.state === 'sleeping') { roll = .32; sq = .92 + Math.sin(t * 1.3 + s.phase) * .03; wag = 0; }
    else { roll = Math.sin(t * .7 + s.phase) * .08 * amp; sq = 1 + Math.sin(t * 2.2 + s.phase) * .025 * amp; }
  }
  if (s.state === 'waiting') fR = 1.3 + Math.sin(t * 9) * .35;
  if (s.spin > 0) { const d = Math.min(s.spin, dt * 9); s.spin -= d; s.yawTarget += d; o.root.rotation.y += d; }

  o.root.position.set(s.pos.x, 0, s.pos.z);
  o.root.rotation.y = lerpAngle(o.root.rotation.y, s.yawTarget, Math.min(1, dt * 8));
  const k = Math.min(1, dt * 14);
  o.pivot.position.y = (moving || s.bounce > 0) ? lift : lerp(o.pivot.position.y, lift, k);
  o.pivot.rotation.x = lerp(o.pivot.rotation.x, pitch, k);
  o.pivot.rotation.z = lerp(o.pivot.rotation.z, roll, Math.min(1, dt * 4));
  const sx = 1 / Math.sqrt(sq);
  o.pivot.scale.set(sx, sq, sx);
  o.flips.R.rotation.z = lerp(o.flips.R.rotation.z, fR, k);
  o.flips.L.rotation.z = lerp(o.flips.L.rotation.z, -fL, k);
  o.tail.rotation.y = lerp(o.tail.rotation.y, wag, k);
  // blinking, and eyes shut while napping
  s.blinkAt -= dt;
  if (s.blinkAt <= 0) { s.blink = .14; s.blinkAt = rand(2.5, 6); }
  if (s.blink > 0) s.blink -= dt;
  const shut = s.state === 'sleeping' || s.blink > 0;
  o.eyes.forEach((e, i) => { e.scale.y = shut ? .12 : (i % 2 ? 1 : 1.15); });
}

function animateWorld(dt, t) {
  // water
  const pa = waterGeo.attributes.position, wa = reduceMotion ? .25 : 1;
  for (let i = 0; i < pa.count; i++) {
    const x = waterBase[i * 3], z = waterBase[i * 3 + 2];
    pa.array[i * 3 + 1] = (Math.sin(x * .16 + t * .9) * .22 + Math.cos(z * .13 + t * 1.2) * .18) * wa;
  }
  pa.needsUpdate = true;
  chunks.forEach(c => { c.position.y = -.45 + Math.sin(t * .8 + c.userData.ph) * .08; c.rotation.y += dt * .03; });
  flags.forEach(f => { f.rotation.y = Math.sin(t * 2.2) * .25; });

  // train
  trainA += dt * (reduceMotion ? .04 : .11);
  trainCars.forEach((g, i) => {
    const a = trainA - i * (1.95 / TRACK_R);
    g.position.set(Math.cos(a) * TRACK_R, .02 + Math.abs(Math.sin(t * 9 + i)) * .03, Math.sin(a) * TRACK_R);
    g.rotation.y = -a;
  });
  wheels.forEach(w => { w.rotation.x += dt * 6; });
  puffTimer -= dt;
  if (puffTimer <= 0 && !reduceMotion) {
    puffTimer = .32;
    chimneyTip.getWorldPosition(tmpV); puff(tmpV, 1);
    smokeSources.forEach(src => { if (Math.random() < .5) { const v = new THREE.Vector3(); src.getWorldPosition(v); puff(v, .8); } });
  }
  puffs.forEach(p => {
    if (!p.visible) return;
    const u = p.userData; u.age += dt;
    const f = u.age / u.life;
    if (f >= 1) { p.visible = false; return; }
    p.position.addScaledVector(u.drift, dt * .9);
    p.scale.setScalar(u.s * (.6 + f * 1.8));
    p.material.opacity = (1 - f) * .85;
  });

  // jumping fish
  fishMeshes.forEach(f => {
    if (!f.g.visible) {
      f.next -= dt;
      if (f.next <= 0 && !reduceMotion) { f.g.visible = true; f.t = 0; f.dur = rand(.9, 1.3); f.a = rand(0, Math.PI * 2); f.r = rand(30, 36); f.h = rand(1.6, 2.6); splash(Math.cos(f.a) * f.r, Math.sin(f.a) * f.r); }
      return;
    }
    f.t += dt / f.dur;
    if (f.t >= 1) { f.g.visible = false; f.next = rand(2.5, 7); const a = f.a + 3 / f.r; splash(Math.cos(a) * f.r, Math.sin(a) * f.r); return; }
    const a = f.a + f.t * 3 / f.r;
    f.g.position.set(Math.cos(a) * f.r, -.4 + Math.sin(Math.PI * f.t) * f.h, Math.sin(a) * f.r);
    f.g.rotation.set(0, -a, 0);
    f.g.rotateX(-Math.cos(Math.PI * f.t) * 1.0);
  });
  splashes.forEach(s => {
    if (!s.visible) return;
    s.userData.age += dt;
    const f = s.userData.age / .9;
    if (f >= 1) { s.visible = false; return; }
    s.scale.setScalar(1 + f * 3); s.material.opacity = (1 - f) * .9;
  });

  // boat
  boatA += dt * .035;
  const BR = 40;
  boat.position.set(Math.cos(boatA) * BR, -.35 + Math.sin(t * 1.4) * .12, Math.sin(boatA) * BR);
  boat.rotation.set(Math.sin(t * 1.1) * .06, -boatA, Math.sin(t * 1.4) * .08);
  const sailor = boat.userData.sailor;
  sailor.pivot.rotation.z = Math.sin(t * 1.4) * .1;
  sailor.flips.R.rotation.z = Math.max(0, Math.sin(t * 2)) * 1.2;

  updateFlyers(dt);

  // aurora
  auroras.forEach(m => {
    const p = m.geometry.attributes.position, b = m.userData.base;
    for (let i = 0; i < p.count; i++) {
      const x = b[i * 3];
      p.array[i * 3 + 2] = Math.sin(x * .06 + t * .35 + m.userData.ph) * 7 + Math.sin(x * .13 + t * .6) * 2.5;
      p.array[i * 3 + 1] = b[i * 3 + 1] + Math.sin(x * .05 + t * .4 + m.userData.ph) * 2;
    }
    p.needsUpdate = true;
    m.material.opacity = nightT * (.55 + Math.sin(t * .7 + m.userData.ph) * .2);
    m.visible = nightT > .02;
  });

  if (snow) {
    const sa = snow.geometry.attributes.position;
    for (let i = 0; i < sa.count; i++) {
      let y = sa.array[i * 3 + 1] - dt * .9; if (y < 0) y = 26;
      sa.array[i * 3 + 1] = y; sa.array[i * 3] += Math.sin(t + i) * dt * .15;
    }
    sa.needsUpdate = true;
  }
}

function placeLabels(w, h) {
  seals.forEach(s => {
    tmpV.set(s.pos.x, (s.state === 'sleeping' ? 1.5 : 1.95) + s.obj.pivot.position.y, s.pos.z).project(camera);
    if (tmpV.z > 1) { s.ui.style.display = 'none'; return; }
    s.ui.style.display = '';
    s.ui.style.transform = 'translate(' + ((tmpV.x + 1) / 2 * w).toFixed(1) + 'px,' + ((1 - tmpV.y) / 2 * h).toFixed(1) + 'px) translate(-50%,-100%)';
  });
  stLabels.forEach(({st, el}) => {
    tmpV.set(st.pos.x, st.top, st.pos.z).project(camera);
    if (tmpV.z > 1) { el.style.display = 'none'; return; }
    el.style.display = '';
    el.style.transform = 'translate(' + ((tmpV.x + 1) / 2 * w).toFixed(1) + 'px,' + ((1 - tmpV.y) / 2 * h).toFixed(1) + 'px) translate(-50%,-100%)';
  });
}

function refreshSealUI(now) {
  seals.forEach(s => {
    s.dot.className = s.state;
    let html = '', cls = 'bubble';
    if (s.say && s.say.until > now) html = esc(s.say.text);
    else if (s.state === 'waiting') { cls += ' waiting'; html = 'Needs you: ' + esc(s.task.ask); }
    else if (s.state === 'working' && s.task && !s.task.finished) html = '<b>' + esc(s.task.tool) + '</b>' + esc(s.task.detail || s.task.text);
    else if (s.state === 'sleeping') { cls += ' sleep'; html = 'z z z'; }
    s.bubble.hidden = !html;
    if (s.bubble.className !== cls) s.bubble.className = cls;
    if (s.bubble._h !== html) { s.bubble.innerHTML = html; s.bubble._h = html; }
  });
  matePills.forEach(m => { const st = m.s.state; m.pill.className = 'pill ' + st; m.pill.textContent = STATUS_TEXT[st]; });
  renderStats();
  if (boardDirty && !liveMode) renderBoard();
  if (selected) renderLive();
}

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  simStep(dt);
  seals.forEach(s => animateSeal(s, dt, t));
  animateWorld(dt, t);

  nightT = lerp(nightT, nightTarget, Math.min(1, dt * 2.2));
  scene.background.copy(DAY.bg).lerp(NIGHT.bg, nightT);
  scene.fog.color.copy(scene.background);
  hemi.color.copy(DAY.sky).lerp(NIGHT.sky, nightT);
  hemi.groundColor.copy(DAY.gnd).lerp(NIGHT.gnd, nightT);
  hemi.intensity = lerp(DAY.hemi, NIGHT.hemi, nightT);
  sun.color.copy(DAY.dirC).lerp(NIGHT.dirC, nightT);
  sun.intensity = lerp(DAY.dir, NIGHT.dir, nightT);
  waterMat.color.copy(DAY.water).lerp(NIGHT.water, nightT);
  windows.forEach(wm => wm.material.color.copy(DAY.win).lerp(NIGHT.win, nightT));
  starMat.opacity = nightT * .9;

  if (selected) {
    tmpV.set(selected.pos.x, .6, selected.pos.z).sub(controls.target).multiplyScalar(Math.min(1, dt * 2.5));
    controls.target.add(tmpV); camera.position.add(tmpV);
    selRing.visible = true;
    selRing.position.x = selected.pos.x; selRing.position.z = selected.pos.z;
    selRing.material.color.set(selected.def.color);
    selRing.scale.setScalar(1 + Math.sin(t * 4) * .06);
  } else selRing.visible = false;

  controls.update();
  renderer.render(scene, camera);
  placeLabels(stage.clientWidth, stage.clientHeight);

  uiTimer -= dt;
  if (uiTimer <= 0) { uiTimer = .35; refreshSealUI(now); }
  requestAnimationFrame(frame);
}
renderBoard();
refreshSealUI(performance.now());
requestAnimationFrame(frame);
})();
</script>
